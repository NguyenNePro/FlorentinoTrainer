
name: Build Florentino Trainer IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack source
        run: |
          unzip -o Florentino-Trainer-Xcode-Source.zip -d source

      - name: Build app
        run: |
          PROJECT=$(find source -name "FlorentinoTrainer.xcodeproj" -print -quit)
          test -n "$PROJECT"
          xcodebuild -project "$PROJECT" \
            -target FlorentinoTrainer \
            -sdk iphoneos \
            -configuration Release \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          APP=$(find build/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r FlorentinoTrainer-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FlorentinoTrainer-unsigned-IPA
          path: FlorentinoTrainer-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
